<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ignion FP&A</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div id="ig-root">
<style>
#ig-root{--red:#C72030;--dark:#660708;--ink:#282828;--bg:#F1ECE8;--panel:#FFFFFF;--line:#E2D9D3;--mut:#8A8078;
 --act:#FCDEE1;--fct:#FFF;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
#ig-root *{box-sizing:border-box}
#ig-root .top{display:flex;align-items:center;gap:14px;padding:12px 22px;background:#fff;border-bottom:3px solid var(--red);position:sticky;top:0;z-index:20}
#ig-root .top img{height:52px}
#ig-root .top h1{font-size:17px;margin:0;color:var(--dark);letter-spacing:.02em}
#ig-root .top .sp{flex:1}
#ig-root .btn{font:inherit;font-size:12.5px;font-weight:bold;color:#fff;background:var(--red);border:none;border-radius:6px;padding:8px 14px;cursor:pointer}
#ig-root .btn.sec{background:#fff;color:var(--red);border:1.5px solid var(--red)}
#ig-root .btn:disabled{opacity:.45;cursor:default}
#ig-root .chip{font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:5px 11px;color:var(--ink)}
#ig-root .chip.ro{background:var(--act)}
#ig-root nav{display:flex;gap:2px;flex-wrap:wrap;padding:8px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:59px;z-index:19}
#ig-root nav button{font:inherit;font-size:12.5px;border:none;background:none;padding:8px 12px;cursor:pointer;color:var(--ink);border-radius:6px 6px 0 0;border-bottom:2.5px solid transparent}
#ig-root nav button.on{color:var(--red);border-bottom-color:var(--red);font-weight:bold}
#ig-root main{padding:18px 22px;max-width:1500px;margin:0 auto}
#ig-root h2{font-size:15px;color:var(--dark);margin:6px 0 10px}
#ig-root .note{font-size:12px;color:var(--mut);margin:4px 0 12px}
#ig-root .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;overflow:auto}
#ig-root table{border-collapse:collapse;font-size:11.5px;white-space:nowrap}
#ig-root table.pgrid{table-layout:fixed}
#ig-root table.ytab{table-layout:fixed;width:100%}
#ig-root table.kpitab{table-layout:fixed;width:100%;border-collapse:collapse}
#ig-root table.kpitab th{background:var(--dark);color:#fff;font-size:12px;padding:7px 8px;text-align:center}
#ig-root table.kpitab th:first-child{text-align:left;position:static}
#ig-root table.kpitab td{border-bottom:1px solid var(--line);text-align:center;padding:8px 8px;font-size:15px;font-weight:bold;color:var(--dark);position:static;background:none}
#ig-root table.kpitab td.klab{background:var(--dark);color:#fff;font-size:12px;text-align:left;padding:8px 12px}
#ig-root table.kpitab td.act{background:var(--act)}
#ig-root table.kpitab td.neg{color:var(--red)}
#ig-root table.ytab td,#ig-root table.ytab th{font-size:14px;padding:5px 8px}
#ig-root th{background:var(--dark);color:#fff;padding:5px 8px;text-align:right;font-weight:bold;position:sticky;top:0}
#ig-root th:first-child{text-align:left;position:sticky;left:0;z-index:3}
#ig-root td{border-bottom:1px solid var(--line);padding:3px 8px;text-align:right}
#ig-root td:first-child{text-align:left;background:#fff;position:sticky;left:0;font-weight:bold;color:var(--dark);z-index:2}
#ig-root tr.tot td{border-top:2px solid var(--dark);font-weight:bold}
#ig-root tr.hdr td{border-top:2px solid var(--dark);font-weight:bold;background:#FAF5F1}
#ig-root tr.mid td{border-top:1.5px solid #C9BEB6;font-weight:bold}
#ig-root tr.det td{color:#6E655E;border-bottom:1px dotted #E7DFD9}
#ig-root tr.det td:first-child{padding-left:24px;font-weight:normal;color:#6E655E;font-style:italic}
#ig-root tr.sub td{font-weight:bold;background:#FAF5F1}
#ig-root td.act{background:var(--act)}
#ig-root td.neg{color:var(--red)}
#ig-root input.cell{width:84px;font:inherit;font-size:11.5px;text-align:right;border:1px solid transparent;border-radius:4px;background:#FDF6E8;padding:2px 4px}
#ig-root input.cell:focus{outline:none;border-color:var(--red);background:#fff}
#ig-root input.wide{width:150px;text-align:left}
#ig-root select.cell{font:inherit;font-size:11.5px;border:1px solid var(--line);border-radius:4px;background:#FDF6E8;padding:2px}
#ig-root .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
#ig-root .strip{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;display:grid;grid-template-columns:190px repeat(6,1fr);align-items:stretch;overflow:hidden}
#ig-root .strip .lab{background:var(--dark);color:#fff;font-weight:bold;font-size:14px;padding:12px 14px;display:flex;align-items:center}
#ig-root .strip .yc{padding:8px 10px;border-left:1px solid var(--line);text-align:center}
#ig-root .strip .yc .yl{font-size:12px;color:var(--mut);letter-spacing:.05em}
#ig-root .strip .yc .yv{font-size:21px;font-weight:bold;color:var(--dark);margin-top:2px}
#ig-root .strip .yc.act{background:var(--act)}
#ig-root .strip .yc .yv.neg{color:var(--red)}
#ig-root .kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--red);border-radius:8px;padding:10px 14px}
#ig-root .kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
#ig-root .kpi .v{font-size:19px;font-weight:bold;color:var(--dark);margin-top:2px}
#ig-root .ov{position:fixed;inset:0;background:rgba(40,40,40,.55);display:none;align-items:center;justify-content:center;z-index:50}
#ig-root .ov.on{display:flex}
#ig-root .login{background:#fff;border-radius:12px;padding:28px;width:340px;border-top:5px solid var(--red)}
#ig-root .login h3{margin:0 0 6px;color:var(--dark)}
#ig-root .fld{margin:10px 0}
#ig-root .fld label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:3px}
#ig-root .fld input{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px}
#ig-root .err{color:var(--red);font-size:12px;min-height:16px;margin-top:6px}
#ig-root .toast{position:fixed;bottom:20px;right:20px;background:var(--dark);color:#fff;padding:10px 16px;border-radius:8px;font-size:12.5px;display:none;z-index:60}
#ig-root .toast.on{display:block}
#ig-root .banner{background:#FDF0D5;border:1px solid #E0C98F;border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:14px}
#ig-root tr.hlwc td{background:#EFE237} /* Pantone 12-0650 TCX Summer Sun */
#ig-root .restrnote{font-size:10px;color:#8A5A00;background:#FFF3D6;border-radius:4px;padding:2px 6px}
#ig-root sup.restrmark{color:#8A5A00;font-size:9px;margin-left:2px}
#ig-root svg text{font-family:Arial}
#ig-root .ovgrid{column-count:2;column-gap:16px}
#ig-root .ovgrid .card,#ig-root .ovgrid .strip,#ig-root .ovgrid .note{break-inside:avoid}
@media (max-width:1100px){#ig-root .ovgrid{column-count:1}}
#ig-root .chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#ig-root .chead h2{margin:0}
#ig-root .cbtn{font:inherit;font-size:10.5px;color:var(--red);background:#fff;border:1px solid var(--red);border-radius:5px;padding:3px 8px;cursor:pointer}
#ig-root .dbtn{background:none;border:none;cursor:pointer;color:#8A8078;padding:2px}
#ig-root .dbtn:hover{color:var(--red)}
#ig-root .dbtn svg{width:13px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

#ig-root .btn.cheat{background:var(--dark)}
#ig-root .csov{position:fixed;inset:0;background:rgba(40,40,40,.45);z-index:60;display:none}
#ig-root .csov.on{display:block}
#ig-root .csp{position:absolute;top:4vh;left:50%;transform:translateX(-50%);width:min(960px,94vw);max-height:92vh;overflow:auto;background:#fff;border-radius:10px;border-top:5px solid var(--dark);box-shadow:0 18px 50px rgba(0,0,0,.35);padding:26px 34px 34px}
#ig-root .csp h2{color:var(--dark);font-size:16px;margin:22px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
#ig-root .csp h3{color:var(--red);font-size:13px;margin:14px 0 4px}
#ig-root .csp p,#ig-root .csp li{font-size:12.5px;line-height:1.55}
#ig-root .csp ul{margin:4px 0 10px 18px;padding:0}
#ig-root .cs-f{font-family:Consolas,Menlo,monospace;font-size:12px;background:#F7F3F0;border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
#ig-root .cshead{display:flex;align-items:center;gap:10px}
#ig-root .cshead h1{font-size:19px;color:var(--dark);margin:0}
#ig-root .csx{margin-left:auto;display:flex;gap:8px}
#ig-root .icobtn{background:#fff;border:1.5px solid var(--dark);color:var(--dark);border-radius:6px;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#ig-root .icobtn svg{width:17px;height:17px;stroke:var(--dark);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>

<div class="top">
  <img id="logo" alt="Ignion">
  <h1>FP&amp;A portal</h1>
  <span class="chip" id="modeChip"></span>
  <span class="sp"></span>
  <span class="chip" id="userChip" style="display:none"><span id="userName"></span> &middot; <span id="userRole"></span></span>
  <select class="cell" id="scnSel" title="Active scenario" style="min-width:130px;font-weight:bold"></select>
  <button class="btn sec" id="scnNew">New scenario</button>
  <button class="btn sec" id="scnDel" style="display:none">Delete scenario</button>
  <button class="btn sec" id="xlTpl">Download budget template</button>
  <button class="btn sec" id="xlOut">Export this budget</button>
  <button class="btn sec" id="xlIn">Import budget template</button>
  <input type="file" id="xlFile" accept=".xlsx" style="display:none">
  <button class="btn cheat" id="csBtn">Cheatsheet</button>
  <button class="btn" id="saveBtn">Save</button>
  <button class="btn sec" id="outBtn" style="display:none">Sign out</button>
</div>
<nav id="nav"></nav>
<main id="main"></main>

<div class="ov" id="login"><div class="login">
  <h3>Ignion FP&amp;A</h3>
  <div class="note" id="liNote">Sign in with your Ignion account.</div>
  <div class="fld"><label>Email</label><input id="liUser" type="email"></div>
  <div class="fld"><label>Password</label><input id="liPass" type="password"></div>
  <button class="btn" id="liBtn" style="width:100%">Sign in</button>
  <div class="err" id="liErr"></div>
</div></div>
<div class="toast" id="toast"></div>

      if(x.comp&&x.otherOpex) DEPTS.forEach(d=>{cd[d]+=num(x.comp[d]); nd[d]+=num(x.otherOpex[d]);});
    }
    for(const k in s){ if(Math.abs(s[k]-num(AP[Y][k]))>tol) bad.push('P&L '+Y+' '+k+': months '+Math.round(s[k])+' vs annual '+Math.round(num(AP[Y][k]))); }
    DEPTS.forEach(d=>{ if(Math.abs(cd[d]-num(AP[Y].comp[d]))>tol) bad.push('P&L '+Y+' comp '+d);
      if(Math.abs(nd[d]-num(AP[Y].otherOpex[d]))>tol) bad.push('P&L '+Y+' non-comp '+d); });
    let cfo=0,cap=0,cff=0,ncf=0,rec=0;

    const A=AC[Y];
    if(Math.abs(cfo-A.cfo)>tol) bad.push('cash '+Y+' operations: months '+Math.round(cfo)+' vs annual '+Math.round(A.cfo));
    if(Math.abs(cap-A.capex)>tol) bad.push('cash '+Y+' investments');
    if(Math.abs(cff-A.cff)>tol) bad.push('cash '+Y+' financing');
    if(Math.abs(ncf-A.ncf)>tol) bad.push('cash '+Y+' net cash flow');
    if(Math.abs(rec-(A.recon||0))>tol) bad.push('cash '+Y+' reconciliation');
    if(Math.abs(cf[ms[0]].open-A.open)>tol) bad.push('cash '+Y+' opening');
    if(Math.abs(cf[ms[11]].close-A.close)>tol) bad.push('cash '+Y+' closing');
    if(Math.abs(A.open+A.ncf+(A.recon||0)-A.close)>tol) bad.push('cash '+Y+' does not foot');

}

function annualPL(Y){

  if(!ms) return pl(Y);
  const agg={rev:{},trev:0,tcogs:0,gm:0,comp:{},otherOpex:{},opex:{},topex:0,ebitda:0,dep:0,wfoa:0,interest:0,otherBTL:0,ebt:0,tax:0,net:0};
  LINES.forEach(l=>agg.rev[l]=0); DEPTS.forEach(d=>{agg.opex[d]=0;agg.comp[d]=0;agg.otherOpex[d]=0;});
  for(const p of ms){ const x=pl(p);
    LINES.forEach(l=>agg.rev[l]+=num(x.rev[l]));
    DEPTS.forEach(d=>{agg.opex[d]+=num(x.opex[d]); if(x.comp)agg.comp[d]+=num(x.comp[d]); else agg.comp[d]=null; if(x.otherOpex)agg.otherOpex[d]+=num(x.otherOpex[d]);});
    agg.trev+=x.trev; agg.tcogs+=x.tcogs; agg.gm+=x.gm; agg.topex+=x.topex; agg.ebitda+=x.ebitda;
    agg.dep+=x.dep; agg.wfoa+=x.wfoa; agg.interest+=x.interest; agg.otherBTL+=x.otherBTL; agg.ebt+=x.ebt; agg.tax+=x.tax; agg.net+=x.net;

function annualCF(){
  const cf=cashflow(); const FM=flowMaps();
  function collFromPrior(Y){ const ms=yearMonths(Y); if(!ms) return null;
    let t=0;
    MONTHS.forEach((p,i)=>{ if(p.slice(0,4)>=Y) return;
      const k=dsoAt(p)/30, f=Math.floor(k), r=k-f;
      [[i+f,1-r],[i+f+1,r]].forEach(([j,s])=>{ if(s>0&&j<MONTHS.length&&MONTHS[j].slice(0,4)===Y) t+=FM.revE[p]*s; }); });
    return t; }
  function revOut(Y){ const ms=yearMonths(Y); if(!ms) return null;
    let t=0;
    ms.forEach(p=>{ const i=MONTHS.indexOf(p);
      const k=dsoAt(p)/30, f=Math.floor(k), r=k-f;
      [[i+f,1-r],[i+f+1,r]].forEach(([j,s])=>{ if(s>0&&(j>=MONTHS.length||MONTHS[j].slice(0,4)>Y)) t+=FM.revE[p]*s; }); });
    return -t; }
  const out={};
  for(const Y of YRS){
    if(Y==='2025'){ out[Y]={close:num(MODEL.params.openingCash)}; continue; }
    const ms=yearMonths(Y);
    if(ms){ const first=cf[ms[0]], last=cf[ms[11]];
      let cfo=0,capex=0,cff=0,ncf=0,capIn=0,dIn=0,dRep=0,gIn=0,gRep=0,oFin=0,recon=0;
      for(const p of ms){ const x=cf[p]; cfo+=x.cfo; capex+=x.capex; cff+=x.cff; ncf+=x.ncf; capIn+=x.capIn; dIn+=x.debtIn; dRep+=x.debtRep; gIn+=x.grantIn; gRep+=x.grantRep; oFin+=x.otherFin; recon+=(x.recon||0); }
      const eb=annualPL(Y).ebitda, rin=collFromPrior(Y), rout=revOut(Y);
      out[Y]={ebitda:eb,revIn:rin,revOut:rout,otherWC:cfo-eb-(rin||0)-(rout||0),cfo,capex,capIn,dIn,dRep,gIn,gRep,oFin,cff,ncf,recon,open:first.open,close:last.close};
    } else {
      const x=cf[Y]; const eb=annualPL(Y).ebitda;
      out[Y]={ebitda:eb,revIn:null,revOut:null,otherWC:x.cfo-eb,cfo:x.cfo,capex:x.capex,capIn:x.capIn,dIn:x.debtIn,dRep:x.debtRep,gIn:x.grantIn,gRep:x.grantRep,oFin:x.otherFin,cff:x.cff,ncf:x.ncf,recon:0,open:x.open,close:x.close};
    }
  }
  return out;
}
function fteAt(Y){
  const ref = Y+'-12';
  const out={}; DEPTS.forEach(d=>out[d]=0);
  for(const e of MODEL.employees){
    if(e.start && e.start.slice(0,7)>ref) continue;
    if(Y!=='2025' && e.dismiss==='Yes' && e.dismissDate && ref>=e.dismissDate) continue;
    out[e.dept]=(out[e.dept]||0)+1;
  }
  return out;
}

function barChart(title,labels,vals,fmtv){

function stackChart(title,labels,series,names,fmtv){

    const stepTable=(title,store,note)=>{
      let s='<div class="card"><h2>'+title+'</h2><table><tr><th>Department</th><th>2028</th><th>2029</th><th>2030</th></tr>';

    h+=stepTable('Long-range non-comp OPEX step-up (% per year)','opexStep','Each year multiplies the previous: 2029 = 2027 base x (1 + 2028%) x (1 + 2029%). Seeded at the increases implied by the reconciled budget, so the budget ties until you change them.');

    }
    bt+='</table><div class="note">The payout % scales the bonus accrued in compensation (severance bases keep the full register bonus). Cash pays no bonus monthly: the year\'s accrued bonus leaves in the chosen month of the following year. The 2030 accrual pays beyond the model horizon.</div></div>';
    h+=bt;
    h+='<div class="card"><h2>Social security rates by country</h2><table>';
    for(const c of Object.keys(P.ssRates)) h+='<tr><td>'+c+'</td><td>'+inputCell(P.ssRates[c],'params|ssRates|'+c,{kind:'pct'})+'</td></tr>';

    /* summary by month and department */
    const hcRows=[...DEPTS.map(d=>({label:d,d,ro:true})),{label:'Total',d:'__T__',ro:true}];
    const hcGet=(r,p)=>{ let n=0; for(const e of MODEL.employees){ if((r.d==='__T__'||e.dept===r.d) && activeInMonth(e,p)) n++; } return n; };
    h+='<div class="card"><h2>Headcount by department and month</h2>'
      +grid(hcRows,MONTHS,hcGet,null,'Department',{int:true,mode:'last'})+'</div>';
    const cRows=[...DEPTS.map(d=>({label:d,d,ro:true})),{label:'Total',d:'__T__',ro:true}];
    const cGet=(r,p)=>{ const c=compByDept(p); return r.d==='__T__'? DEPTS.reduce((s,d)=>s+num(c[d]),0) : c[r.d]; };
    h+='<div class="card"><h2>Compensation cost by department and month (EUR)</h2>'

  if(CUR==='opex'){

    MODEL.otherOpex.forEach((row,i)=>{

      h+=grid([{label:'Drawdowns',k:'drawdowns',i},{label:'Repayments',k:'repayments',i},{label:'Interest',k:'interest',i}],PERIODS,

  if(CUR==='grants'){
    h+='<div class="card"><h2>Grant register ('+MODEL.grants.length+')</h2><table><tr><th>Grant</th><th>Line</th><th>Status</th><th>Grant date</th><th>Amount</th><th>Pending</th></tr>';
    MODEL.grants.forEach(g=>{ h+='<tr><td>'+g.name+'</td><td>'+g.line+'</td><td>'+g.status+'</td><td>'+fmtDate(g.date)+'</td><td>'+fmt(g.amount)+'</td><td>'+fmt(g.pending)+'</td></tr>'; });
    h+='</table></div>';
    h+='<div class="card"><h2>Grant collections and repayments (EUR)</h2>';

      h+='<div style="margin:10px 0 4px;font-weight:bold;color:var(--dark)">'+g.name+'</div>';

  const ao=$('addOpex'); if(ao) ao.onclick=()=>{MODEL.otherOpex.push({dept:DEPTS[0],costCenter:'New cost center',values:{}});dirty=true;render();};

  const ag=$('addGrant'); if(ag) ag.onclick=()=>{MODEL.grants.push({name:'New grant',line:'',status:'Applied',amount:0,pending:0,collections:{},repayments:{}});dirty=true;render();};

/* ---------- excel round trip ---------- */
function buildParamWB(tpl){
  const wb=XLSX.utils.book_new();
  wb.Props={Title:tpl?'Ignion FP&A parameter template':'Ignion FP&A parameters',Author:'Xavier Sanso',Company:'Ignion'};
  const hdr=p=> (tpl&&isMonth(p)&&closed(p)) ? p+' (closed)' : p;
  const cols=['Line',...PERIODS.map(hdr)];
  function sheetFromGrid(name,rows){ const ws=XLSX.utils.aoa_to_sheet([cols,...rows]); XLSX.utils.book_append_sheet(wb,ws,name); }
  if(tpl){
    const ct=MODEL.params.closedThrough;
    const nx=MONTHS[MONTHS.indexOf(ct)+1]||'(none)';
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([
      ['Ignion FP&A parameter template'],
      ['Actuals are closed through '+ct+'. The next month to close is '+nx+'.'],
      ['Columns marked (closed) are locked: the import ignores them, so closed months cannot be overwritten from the forecast sheets.'],
      ['To close '+nx+': fill its column on the Actuals sheet, including Cash close, then upload. The closed-through marker advances automatically.'],
      ['All other sheets update the forecast for open months only. Debt and grant schedules are edited in the portal.'],
      ['Dates are dd.mm.yyyy. GM and rates are plain numbers (GM as 0 to 1 in this file).']
    ]),'Read me');
  }
  sheetFromGrid('Revenue USD',LINES.map(l=>[LNAME[l],...PERIODS.map(p=>num((MODEL.revenueUSD[l]||{})[p]))]));
  sheetFromGrid('GM pct',LINES.map(l=>[LNAME[l],...PERIODS.map(p=>num((MODEL.gmPct[l]||{})[p]))]));
  sheetFromGrid('Other OPEX',MODEL.otherOpex.map(r=>[r.dept+' | '+r.costCenter,...PERIODS.map(p=>num((r.values||{})[p]))]));
  sheetFromGrid('Capex',DEPTS.map(d=>[d,...PERIODS.map(p=>num((MODEL.capex[d]||{})[p]))]));
  sheetFromGrid('Below EBITDA',[['Depreciation',...PERIODS.map(p=>num(MODEL.nonEbitda.dep[p]))],['Works for own assets',...PERIODS.map(p=>num(MODEL.nonEbitda.wfoa[p]))],['Other non-EBITDA',...PERIODS.map(p=>num(MODEL.nonEbitda.otherBTL[p]))]]);
  const eh=['Name','Dept','Country','Entity','Start','Gross monthly','Bonus annual','Variable annual','Dismiss','Dismiss month','Redundancy','Notice period','Non-compete'];
  const er=MODEL.employees.map(e=>[e.name,e.dept,e.country,e.entity,e.start,num(e.grossMonthly),num(e.bonusAnnual),num(e.variableAnnual),e.dismiss,e.dismissDate,Math.round(sevRedundancyCalc(e)*100)/100,num(e.sevNotice),num(e.sevNonCompete)]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([eh,...er]),'Employees');
  const ALINES=[...LINES.map(l=>'Revenue '+LNAME[l]),'COGS',...DEPTS.map(d=>'OPEX '+d),...DEPTS.map(d=>'Comp '+d),...['CF EBITDA','CF Bonus 2026','CF Bonus 2025','CF Other working capital','CF Interest','CF WC adjustments','CF Capex','CF Debt repayment','CF Debt raised','CF Capital raised','CF Grants raised'],'Depreciation','Works for own assets','Interest','Other non-EBITDA','Taxes','Cash close'];
  const arows=ALINES.map(nm=>[nm,...MONTHS.map(p=>{const a=MODEL.actuals[p]; if(!a)return null;
    if(nm.startsWith('Revenue ')){const l=LINES.find(x=>LNAME[x]===nm.slice(8));return num(a.revenue[l]);}
    if(nm==='COGS')return num(a.cogs); if(nm.startsWith('OPEX '))return num(a.opex[nm.slice(5)]);
    if(nm.startsWith('Comp '))return a.comp?num(a.comp[nm.slice(5)]):null;
    if(nm.startsWith('CF ')){ if(!a.cf)return null; const K={'CF EBITDA':'ebitda','CF Bonus 2026':'bonus26','CF Bonus 2025':'bonus25','CF Other working capital':'owc','CF Interest':'interest','CF WC adjustments':'wcadj','CF Capex':'capex','CF Debt repayment':'debtRep','CF Debt raised':'debtIn','CF Capital raised':'capIn','CF Grants raised':'grantIn'}; return num(a.cf[K[nm]]); }
    if(nm==='Depreciation')return num(a.dep); if(nm==='Works for own assets')return num(a.wfoa);
    if(nm==='Interest')return num(a.interest); if(nm==='Other non-EBITDA')return num(a.otherBTL);
    if(nm==='Taxes')return num(a.taxes); if(nm==='Cash close')return num(a.cashClose); return null;})]);
  const status=['Status',...MONTHS.map(p=> closed(p)?'closed':(MONTHS[MONTHS.indexOf(MODEL.params.closedThrough)+1]===p?'NEXT TO CLOSE':'open'))];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Line',...MONTHS],status,...arows]),'Actuals');
  sheetFromGrid('Rates',[['FX USD per EUR',...PERIODS.map(p=>fxAt(p))],['DSO days',...PERIODS.map(p=>isMonth(p)?dsoAt(p):null)],['DPO days',...PERIODS.map(p=>isMonth(p)?dpoAt(p):null)]]);
  const bonusRows=[['Parameter','2026','2027','2028','2029','2030'],
    ['Pay month (of following year)',...['2026','2027','2028','2029','2030'].map(Y=>bpMonth(Y))],
    ['Payout %',...['2026','2027','2028','2029','2030'].map(Y=>bpPct(Y))]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(bonusRows),'Bonus');
  const stepRows=[['Parameter','Department','2028','2029','2030']];
  for(const d of DEPTS) stepRows.push(['Non-comp OPEX step %',d,...['2028','2029','2030'].map(y=>num(((MODEL.params.opexStep||{})[d]||{})[y]))]);
  for(const d of DEPTS) stepRows.push(['Salary step %',d,...['2028','2029','2030'].map(y=>num(((MODEL.params.salStep||{})[d]||{})[y]))]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(stepRows),'Step-up');
  sheetFromGrid('Working capital',MODEL.wcLines.map(w=>[w.name,...PERIODS.map(p=>num((w.values||{})[p]))]));
  sheetFromGrid('Financing',[['Capital in',...PERIODS.map(p=>num((MODEL.financing.capitalIn||{})[p]))],['Other financing',...PERIODS.map(p=>num((MODEL.financing.otherFin||{})[p]))]]);
  const ph=[['Parameter','Value'],['Tax rate',MODEL.params.taxRate],['Closed through',MODEL.params.closedThrough],['Opening cash 2026',MODEL.params.openingCash]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ph),'Parameters');
  return wb;
}
function appendOutputSheets(wb){ /* computed outputs; ignored on import by construction */
  const fmtEUR='\u20AC#,##0';
  const setFmt=(ws,fmt,rowFmts)=>{ if(!ws||!ws['!ref'])return;
    for(const addr in ws){ if(addr[0]==='!')continue; const c=ws[addr];
      if(c&&c.t==='n'){ const rr=parseInt(addr.replace(/^[A-Z]+/,''),10);
        c.z=(rowFmts&&rowFmts[rr])||fmt; } } };
  /* P&L */
  const pr=[['Line',...OUTCOLS.map(plabel)]];
  const P_=OUTCOLS.map(p=>pl(p));
  for(const l of LINES) pr.push([LNAME[l],...P_.map(x=>num(x.rev[l]))]);
  pr.push(['Total revenue',...P_.map(x=>x.trev)]);
  pr.push(['COGS',...P_.map(x=>x.tcogs)]);
  pr.push(['Gross margin',...P_.map(x=>x.gm)]);
  for(const d of DEPTS) pr.push(['OPEX '+d,...P_.map(x=>num(x.opex[d]))]);
  pr.push(['Total OPEX',...P_.map(x=>x.topex)]);
  pr.push(['EBITDA',...P_.map(x=>x.ebitda)]);
  pr.push(['Depreciation',...P_.map(x=>x.dep)]);
  pr.push(['Works for own assets',...P_.map(x=>x.wfoa)]);
  pr.push(['Interest',...P_.map(x=>x.interest)]);
  pr.push(['Other non-EBITDA',...P_.map(x=>x.otherBTL)]);
  pr.push(['EBT',...P_.map(x=>x.ebt)]);
  pr.push(['Taxes',...P_.map(x=>x.tax)]);
  pr.push(['Net income',...P_.map(x=>x.net)]);
  const wsP=XLSX.utils.aoa_to_sheet(pr); setFmt(wsP,fmtEUR);
  XLSX.utils.book_append_sheet(wb,wsP,'P&L');
  /* Cashflow */

        if(!tgt) continue; MODEL.params[tgt]=MODEL.params[tgt]||{};

    const bs=S('Bonus');

    const emp=S('Employees');

        let e=MODEL.employees.find(x=>x.name===row[0]);
        if(!e){ e={id:'e'+Math.random().toString(36).slice(2,7),name:String(row[0])}; MODEL.employees.push(e); }
        e.dept=row[1]||e.dept; e.country=row[2]||e.country; e.entity=row[3]||e.entity; e.start=row[4]||e.start;
        e.grossMonthly=num(row[5]); e.bonusAnnual=num(row[6]); e.variableAnnual=num(row[7]);

    if(acts){ const hdr=acts[0]; const byLine={}; acts.slice(1).forEach(r=>{ if(r[0]) byLine[r[0]]=r; });

        if(!any)return;

        const LEGACY={prod_lic:'Revenue Product',services:'Revenue Service',troves_unl:'Revenue OXION',edl_unl:'Revenue EDL',grants:'Revenue Grants'};
        LINES.forEach(l=>{ let v=gv('Revenue '+LNAME[l]); if(v==null&&LEGACY[l]) v=gv(LEGACY[l]); a.revenue[l]=v||0; });
        DEPTS.forEach(d=>a.opex[d]=gv('OPEX '+d)||0);
        const compVals={}; let anyComp=false;
        DEPTS.forEach(d=>{ const v=gv('Comp '+d); if(v!=null){anyComp=true;} compVals[d]=v||0; });
        if(anyComp) a.comp=compVals;
        const K={'CF EBITDA':'ebitda','CF Bonus 2026':'bonus26','CF Bonus 2025':'bonus25','CF Other working capital':'owc','CF Interest':'interest','CF WC adjustments':'wcadj','CF Capex':'capex','CF Debt repayment':'debtRep','CF Debt raised':'debtIn','CF Capital raised':'capIn','CF Grants raised':'grantIn'};
        const cfVals={}; let anyCF=false;
        for(const nm in K){ const v=gv(nm); if(v!=null) anyCF=true; cfVals[K[nm]]=v||0; }
        if(anyCF) a.cf=cfVals;
        a.cogs=gv('COGS')||0; a.dep=gv('Depreciation')||0; a.wfoa=gv('Works for own assets')||0;
        a.interest=gv('Interest')||0; a.otherBTL=gv('Other non-EBITDA')||0; a.taxes=gv('Taxes')||0;
        a.cashClose=cc||0;
        MODEL.actuals[k]=a;
        if(cc && (!newest||k>newest)) newest=k;
      });
      if(newest && newest>MODEL.params.closedThrough) MODEL.params.closedThrough=newest;
    }
    dirty=true; render(); toast('Parameters imported.');
  }catch(e){ toast('Import failed: '+e.message,true); }
}

/* ---------- persistence ---------- */
let dirty=false;
/* Conditional write. Updates only if updated_at still equals the value we read,
   so a document saved by someone else since we loaded is never clobbered.
   Returns the new updated_at, or null when the row moved under us. */
async function writeGuarded(key,value,token){
  const now=new Date().toISOString();
  let q;
  if(token===null){
    q=await sb.from('app_data').insert({key:key,value:value,updated_at:now}).select('updated_at');
  } else {
    q=await sb.from('app_data').update({value:value,updated_at:now})
        .eq('key',key).eq('updated_at',token).select('updated_at');
  }
  if(q.error) throw q.error;
  if(!q.data||!q.data.length) return null;
  return q.data[0].updated_at||now;
}
async function save(){
  if(!canWrite()){toast('Read only access.',true);return;}
  if(!CONFIGURED){toast('Preview mode: connect Supabase to save shared data.',true);return;}
  if(!LOAD_OK){toast('The shared budget did not load, so saving is blocked. Reload the page.',true);return;}
  if(SCN==='Budget'){
    if(Object.keys(SCNS).length && typeof window.confirm==='function'
       && !window.confirm('You are saving the reference Budget, not a scenario. Continue?')) return;
    try{
      const tok=await writeGuarded('ignion_model',MODEL,LOADED_AT);
      if(tok===null){
        banner('Someone else saved the budget after you loaded it. Your changes were NOT saved. '
          +'Export this budget to keep your work, then reload and reapply it.');
        toast('Not saved: the shared budget moved under you.',true);
        return;
      }
      LOADED_AT=tok; REMOTE_AHEAD=false; banner(null);
      /* actuals are facts: propagate the close to every scenario */
      let prop=false;
      for(const n of Object.keys(SCNS)){ SCNS[n].actuals=deepClone(MODEL.actuals); SCNS[n].params.closedThrough=MODEL.params.closedThrough; prop=true; }
      if(prop) await persistScenarios();
      dirty=false; toast('Budget saved'+(prop?'; actuals propagated to all scenarios.':'.')); }
    catch(e){ toast('Save failed: '+(e.message||e),true); try{ console.error('[ignion] save failed:',e); }catch(_){} }
  } else {
    SCNS[SCN]=MODEL;
    try{
      const tok=await writeGuarded('ignion_scenarios',SCNS,SCN_LOADED_AT);
      if(tok===null){
        banner('Someone else saved a scenario after you loaded. Your changes were NOT saved. Reload and reapply.');
        toast('Not saved: scenarios moved under you.',true);
        return;
      }
      SCN_LOADED_AT=tok; dirty=false; banner(null); toast('Scenario "'+SCN+'" saved.'); }
    catch(e){ toast('Save failed: '+(e.message||e),true); try{ console.error('[ignion] save failed:',e); }catch(_){} }
  }
}
async function loadShared(){
  /* Contract: on return, either LOAD_OK is true and MODEL is the shared budget
     (or the seed, when the table is provably empty on a first run), or LOAD_OK
     is false and a banner explains why. It never fails silently.
     Note that maybeSingle() returns {data:null,error:null} both when no row
     exists and when row level security filters the row out. Those cases are not
     distinguishable from the client, so we refuse to guess: no row means no
     save, and the banner says so. */
  LOAD_OK=false; LOADED_AT=null; SCN_LOADED_AT=null; banner(null);
  let row=null;
  try{
    const {data,error}=await sb.from('app_data').select('value,updated_at').eq('key','ignion_model').maybeSingle();
    if(error) throw error;
    row=data;
  }catch(e){
    loadFailed('Could not read the shared budget: '+(e.message||e)+'.');
    return;
  }
  if(row&&row.value){
    MODEL=migrateModel(row.value); BUDGET=MODEL; LOADED_AT=row.updated_at||null; LOAD_OK=true;
  } else {
    /* No row came back. Do not present the seed as if it were the budget. */
    loadFailed('No shared budget was returned for key ignion_model. You are looking at an empty starter model, not the company budget. '
      +'This is either a genuine first run or a read permission problem on app_data.');
    return;
  }
  try{
    const {data:d2,error:e2}=await sb.from('app_data').select('value,updated_at').eq('key','ignion_scenarios').maybeSingle();
    if(e2) throw e2;
    if(d2&&d2.value){ SCNS=d2.value; for(const n in SCNS) SCNS[n]=migrateModel(SCNS[n]); SCN_LOADED_AT=d2.updated_at||null; }
  }catch(e){
    /* Scenarios are not load bearing for the close, so this degrades rather
       than blocks, but it is still reported. */
    toast('Scenarios could not be read: '+(e.message||e),true);
    try{ console.error('[ignion] scenario load failed:',e); }catch(_){}
  }
  if(SCN!=='Budget'&&!SCNS[SCN]){ SCN='Budget'; MODEL=BUDGET; }
}
function subscribeLive(){
  if(!sb||!sb.channel)return;
  try{ sb.channel('ignion_live').on('postgres_changes',{event:'*',schema:'public',table:'app_data'},pl=>{
    const row=pl.new||pl.old; if(!row)return;
    if(row.key==='ignion_model'&&row.value){
      /* Track the new version so a later save is compared against reality.
         When we hold unsaved edits we do not clobber them, but we must say so,
         because the previous behaviour was to drop the update in silence and
         then overwrite the other person's work on the next save. */
      if(row.updated_at) LOADED_AT_REMOTE=row.updated_at;
      if(SCN==='Budget'&&dirty){
        REMOTE_AHEAD=true;
        banner('Another user just saved the budget. Your unsaved edits are still here, but they are now based on an old copy. '
          +'Export this budget to keep your work, then reload.','warn');
        return;
      }
      BUDGET=migrateModel(row.value);
      if(row.updated_at) LOADED_AT=row.updated_at;
      if(SCN==='Budget'){ MODEL=BUDGET; }
      render(); }
    if(row.key==='ignion_scenarios'&&row.value){ SCNS=row.value; for(const n in SCNS) SCNS[n]=migrateModel(SCNS[n]);
      if(SCN!=='Budget'){ if(dirty)return; if(SCNS[SCN]){ MODEL=SCNS[SCN]; } else { SCN='Budget'; MODEL=BUDGET; toast('The active scenario was deleted elsewhere; back on Budget.',true); } render(); }
      else syncScnUI(); } }).subscribe(); }catch(e){}
}

function banner(msg,kind){

     for conditions the user must act on: failed load, stale copy, blocked save. */

    b.style.cssText='position:fixed;left:0;right:0;top:0;z-index:9999;padding:10px 16px;'

      +'box-shadow:0 2px 8px rgba(0,0,0,.18)';

async function bootAuth(){

  $('modeChip').textContent='Shared';
  try{ const {data}=await sb.auth.getSession(); if(data&&data.session){ await onSignedIn(data.session.user); return; } }catch(e){}
  $('login').classList.add('on');
}
$('liBtn').onclick=async()=>{
  const {data,error}=await sb.auth.signInWithPassword({email:$('liUser').value.trim(),password:$('liPass').value});
  if(error){$('liErr').textContent=error.message;return;}
  $('liErr').textContent=''; await onSignedIn(data.user); };
$('outBtn').onclick=async()=>{ try{await sb.auth.signOut();}catch(e){} location.reload(); };
$('saveBtn').onclick=save;
$('xlOut').onclick=exportParams;
$('scnSel').onchange=e=>{ const n=e.target.value;
  if(n===SCN)return;
  if(dirty && typeof window.confirm==='function' && !window.confirm('Discard unsaved changes in "'+SCN+'"?')){ syncScnUI(); return; }
  switchScn(n); };
$('scnNew').onclick=()=>{ if(!canWrite()){toast('Read only access.',true);return;}
  const n=(typeof window.prompt==='function')? window.prompt('Name for the new scenario (starts as a copy of "'+SCN+'"):') : null;
  if(!n)return; const nm=n.trim();
  if(!nm||nm.toLowerCase()==='budget'){toast('Pick a name other than Budget.',true);return;}
  if(SCNS[nm]){toast('A scenario with that name already exists.',true);return;}
  SCNS[nm]=deepClone(MODEL); SCN=nm; MODEL=SCNS[nm]; dirty=true;
  toast('Scenario "'+nm+'" created in this session. Save to publish it.'); render(); };
$('scnDel').onclick=async()=>{ if(SCN==='Budget'||!canWrite())return;
  if(typeof window.confirm==='function' && !window.confirm('Delete scenario "'+SCN+'" for everyone?'))return;
  delete SCNS[SCN]; SCN='Budget'; MODEL=BUDGET; dirty=false;
  await persistScenarios(); toast('Scenario deleted.'); render(); };
$('xlTpl').onclick=exportTemplate;
$('xlIn').onclick=()=>{ if(!canWrite()){toast('Read only access.',true);return;} $('xlFile').click(); };
$('xlFile').onchange=e=>{ if(e.target.files[0]) importParams(e.target.files[0]); e.target.value=''; };
window.addEventListener('beforeunload',e=>{ if(dirty){e.preventDefault();e.returnValue='';} });
const CS_BODY="\n<h2>1. Formulas by subtab, and where each lands in the P&amp;L and the cashflow</h2>\n<h3>Revenue &amp; GM</h3>\n<ul>\n<li>Inputs: Revenue USD per line and month, GM% per line and month.</li>\n<li><span class=\"cs-f\">Revenue EUR = Revenue USD / FX of the month</span>. <span class=\"cs-f\">COGS = - Revenue x (1 - GM%)</span>. Closed months read booked actuals instead.</li>\n<li>P&amp;L: the eight revenue lines, COGS and gross margin at the top. Cashflow: commercial revenue collects with the DSO lag, day-weighted across months; the Grants line does not follow DSO, it collects per the Grants tab schedules.</li>\n</ul>\n<h3>Compensation</h3>\n<ul>\n<li><span class=\"cs-f\">Loaded monthly = gross x (1 + country SS rate) + (bonus + variable) / 12</span>, counted from the start month. A dismissal stops the cost in the dismissal month and books the severance there: <span class=\"cs-f\">redundancy = (gross x 12 + bonus + variable) / 365 x days per year of service x tenure years</span> (capped at the months cap) <span class=\"cs-f\">+ notice + non-compete</span>. Payback months = exit cost / (loaded annual / 12).</li>\n<li>2028 to 2030: <span class=\"cs-f\">loaded x months active in the year x salary step-up chain</span>; starts and dismissals prorate by month, severance books in the dismissal year.</li>\n<li>The bonus accrues at <span class=\"cs-f\">bonus x payout % of the year</span> (Parameters); severance bases keep the full register bonus.</li>\n<li>P&amp;L: department compensation inside Total OPEX. Cashflow: salaries and severance pay through the DPO lag; the bonus does not pay monthly, the year's accrued bonus leaves as one lump in the chosen month of the following year.</li>\n</ul>\n<h3>Other OPEX</h3>\n<ul>\n<li>Monthly inputs per cost center. 2028 to 2030 are computed, not typed: <span class=\"cs-f\">2027 total of the row x (1 + step 2028%) x (1 + step 2029%) x (1 + step 2030%)</span> of its department.</li>\n<li>P&amp;L: department non-comp inside Total OPEX. Cashflow: pays through the DPO lag.</li>\n</ul>\n<h3>Below EBITDA</h3>\n<ul>\n<li>Direct inputs: D&amp;A, write-offs and other, interest, other below-EBITDA. <span class=\"cs-f\">EBT = EBITDA + D&amp;A + write-offs + interest + other</span>; <span class=\"cs-f\">net income = EBT + tax</span>.</li>\n<li>Cashflow: none of these lines moves cash directly. D&amp;A is non-cash and tax has no cash line in the engine. The P&amp;L interest is automatic: the Debt tab schedules flow into it by themselves, and the Interest input here is an overlay for interest outside those schedules (leases, FX charges), also non-cash unless scheduled on the Debt tab.</li>\n</ul>\n<h3>Capex &amp; WC</h3>\n<ul>\n<li>Capex per department and month: no P&amp;L effect (depreciation is the D&amp;A input); cash out in full in its month, no DPO lag.</li>\n<li>Working capital lines: direct cash adjustments in their month, inside operating cash flow; no P&amp;L effect.</li>\n</ul>\n<h3>Financing</h3>\n<ul>\n<li>Capital in and other financing: cash in per month entered, financing section; no P&amp;L effect.</li>\n</ul>\n<h3>Debt</h3>\n<ul>\n<li>Per instrument: drawdowns (cash in, financing), repayments (cash out, financing), interest (cash out, operating, paid in its month with no DPO lag). The same interest schedules flow automatically into the P&amp;L interest line, so expense and payment always agree by construction.</li>\n</ul>\n<h3>Grants</h3>\n<ul>\n<li>Per grant: collection and repayment schedules, cash only, financing section. The Grants revenue line in Revenue &amp; GM is the P&amp;L side and is independent, keep the two coherent.</li>\n</ul>\n<h3>P&amp;L and Cashflow tabs</h3>\n<ul>\n<li>Pure outputs, nothing typed. P&amp;L per period: revenue to net income with the identities above. Cashflow: <span class=\"cs-f\">operating = collections + payments + working capital + debt interest</span>; <span class=\"cs-f\">investments = capex</span>; <span class=\"cs-f\">net cash flow = operating + investments + financing</span>; in closed months an explicit actuals reconciliation row carries the difference between booked cash and the modelled flows, so every column foots; <span class=\"cs-f\">closing cash = opening + net cash flow</span>, each month opening at the prior close. January 2026 opens at the opening cash parameter; closed months anchor to the booked closing cash; 2028 to 2030 derive from the annual P&amp;L plus the same schedules. Bonus cash is re-phased: each year's accrual is stripped from the monthly cost base and paid as a lump in the payout month of the following year; the lump is the full-year entitlement prorated by service months; the 2030 accrual pays beyond the horizon.</li>\n</ul>\n<h3>Overview</h3>\n<ul>\n<li>Reads the outputs only: KPI strip, revenue charts, department P&amp;L, cash curve against the 1.0M EUR safety net, severance panel (exit cost, annual saving, payback per dismissed employee) and the scenario comparison.</li>\n<li>A live integrity check re-sums the 24 monthly P&amp;L and cashflow columns independently on every render and compares them to the 2026 and 2027 annual summaries, line by line including per-department compensation and the cash footing; it is silent when everything ties and shows a red banner naming the broken lines if it ever does not.</li>\n</ul>\n<h2>2. How each parameter influences the budget</h2>\n<ul>\n<li><b>Opening cash 2026</b>: the starting point of the cash chain; every closing balance moves one for one with it until the first closed month anchor.</li>\n<li><b>Closed through</b>: locks all inputs of closed months, anchors their cash to booked closes, and advances only by filling a month in the Actuals sheet including its closing cash.</li>\n<li><b>Tax rate</b>: net income only; no cash effect.</li>\n<li><b>FX USD per EUR (monthly curve)</b>: converts the USD revenue inputs; a higher rate means fewer EUR of revenue, margin and collections in that month.</li>\n<li><b>DSO days (monthly curve)</b>: delays collections; 30 more days pushes each month's commercial revenue one month later in cash, worsening the trough.</li>\n<li><b>DPO days (monthly curve)</b>: delays payments; more days retain cash longer and flatter the trough, fewer days do the opposite.</li>\n<li><b>Social security rates by country</b>: load every salary; they move department comp, EBITDA, the severance saving and payback of every dismissal in that country.</li>\n<li><b>Severance rules</b> (days per year and cap by country; the Spain dismissal type toggle sets 20 days capped at 12 months for objective or 33 capped at 24 for unfair): price the redundancy of every dismissal; the toggle can move a Spanish exit cost by roughly two thirds upward.</li>\n<li><b>Non-comp OPEX step-up % (department x 2028, 2029, 2030)</b>: builds long-range non-comp from the 2027 base, compounding; seeded at the increases implied by the reconciled budget, so the budget ties until you change them.</li>\n<li><b>Salary step-up % (department x year)</b>: indexes long-range loaded compensation, compounding; seeded at zero. Severance amounts are not indexed.</li>\n<li><b>Bonus pay month (per accrual year)</b>: the month of the following year when the year's bonus pool leaves cash; it moves the outflow across the year boundary without touching the P&amp;L.</li>\n<li><b>Bonus payout % (per accrual year)</b>: scales the bonus accrued in compensation, so 80% accrues and pays 80% of the register bonuses; EBITDA, savings and the lump all follow; severance bases do not.</li>\n</ul>\n<h2>3. Workflow to operate the tool</h2>\n<ul>\n<li><b>Roles.</b> Read-write users edit and save; read-only users see everything but change nothing. New users start read-only.</li>\n<li><b>Edit then Save.</b> All edits are local to your browser until you press Save, which publishes to the shared database. Leaving with unsaved changes triggers a warning.</li>\n<li><b>Monthly close.</b> On the Budget only: import a template with the month's Actuals column filled, including the closing cash. The month locks everywhere, the closed-through marker advances, and the next Save propagates actuals to every scenario.</li>\n<li><b>Closed months are immutable.</b> Grids show them shaded; imports cannot write them by construction.</li>\n</ul>\n<h2>4. Scenarios</h2>\n<ul>\n<li><b>New scenario</b> clones the active model under a name. The selector turns red when you are not on the Budget.</li>\n<li>Edits and Save apply to the active scenario only. Budget stays the reference; actuals enter through the Budget and propagate to all scenarios on Budget save. Actuals import is blocked on non-Budget scenarios.</li>\n<li><b>Delete scenario</b> is permanent. The Overview shows a comparison table and cash chart when scenarios exist: Budget solid, scenarios dashed.</li>\n</ul>\n<h2>5. Downloading and uploading budgets</h2>\n<ul>\n<li><b>Download budget template</b>: a prefilled workbook of every input; closed columns are marked and will be ignored on import. Edit any open cell in Excel.</li>\n<li><b>Export this budget</b>: the complete archive of the active scenario, inputs including the Step-up and Bonus sheets plus three computed output sheets, P&amp;L, Cashflow and Overview. Importing the file reads only the inputs; the output sheets are recalculated by the tool and ignored on upload.</li>\n<li><b>Import budget template</b>: reads either file. Only open periods are written; employees are updated or added by name, never deleted (use the row dustbin in Compensation to remove someone); the redundancy column is recalculated, not imported. Review, then Save to publish.</li>\n</ul>\n";
